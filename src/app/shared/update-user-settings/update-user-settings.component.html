

<div class="p-3">
  <div class="text-2xl font-semibold mb-3">{{ isUpdate ? 'Update Settings' : 'Create Settings' }}</div>

  <form [formGroup]="form" (ngSubmit)="save()" class="grid gap-3">
    <!-- Name -->
    <div class="col-12">
      <p-floatlabel>
        <input id="name" type="text" pInputText formControlName="name" class="w-full" />
        <label for="name">Name</label>
      </p-floatlabel>
      <div class="text-red-500 text-sm mt-1" *ngIf="form.get('name')?.invalid && (form.get('name')?.dirty || form.get('name')?.touched)">
        Name is required.
      </div>
    </div>

    <!-- API Key -->
    <div class="col-12">
      <p-floatlabel>
        <input id="apiKey" type="text" pInputText formControlName="apiKey" class="w-full" />
        <label for="apiKey">API Key</label>
      </p-floatlabel>
    </div>

    <!-- Limit Calls -->
    <div class="col-12">
      <p-floatlabel>
        <p-inputNumber inputId="limitCalls" formControlName="limitCalls" [min]="0" [step]="1" [showButtons]="true" class="w-full"></p-inputNumber>
        <label for="limitCalls">Limit Calls</label>
      </p-floatlabel>
    </div>

    <!-- Save Button -->
    <div class="col-12 mt-2">
      <button pButton type="submit" label="Save" [disabled]="!canSave" class="w-full"></button>
    </div>
  </form>
</div>
