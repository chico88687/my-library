@if (isLoading) {
  <div class="flex justify-content-center">
    <p-progress-spinner strokeWidth="8"
                        fill="transparent"
                        animationDuration=".5s"
                        [style]="{ width: '50px', height: '50px' }"/>
  </div>
} @else {
  <div class="p-card mb-3 p-3" style="background-color: #222225; border-radius: 8px;">
    <div class="flex flex-column gap-3">
      <span class="flex justify-content-center text-base">Delete Books, Wish List And Categories</span>
      <div class="flex justify-content-center">
        <p-button [styleClass]="'long-button'" icon="pi pi-trash" (onClick)="confirmContentDataDelete($event)" severity="danger"/>
      </div>
    </div>
  </div>

  <div class="p-card mb-3 p-3" style="background-color: #222225; border-radius: 8px;">
    <div class="flex flex-column gap-3">
      <span class="flex justify-content-center text-base">Delete All App Data Including User</span>
      <div class="flex justify-content-center">
        <p-button [styleClass]="'long-button'" icon="pi pi-trash" (onClick)="confirmAppDataDelete($event)" severity="danger"/>
      </div>
    </div>
  </div>
}
<p-confirmDialog [position]="'bottom'"/>
