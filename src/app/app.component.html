@if (userAlreadyCreated) {
  <router-outlet></router-outlet>
  <p-tabs value="/dashboard">
    <p-tablist>
      @for (tab of tabs; track tab.route) {
        <p-tab [value]="tab.route" [routerLink]="tab.route" class="flex items-center !gap-2 text-inherit">
          <i [class]="tab.icon"></i>
          <span>{{ tab.label }}</span>
        </p-tab>
      }
    </p-tablist>
  </p-tabs>
} @else {
  <p>It looks like you haven't created your user settings yet. Please go to the settings page to get started.</p>
}
